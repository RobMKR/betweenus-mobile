name: Mobile checks
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run export
        env:
          EXPO_PUBLIC_API_URL: http://localhost:3001
          EXPO_PUBLIC_DEMO_MODE: 'false'
